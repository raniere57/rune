name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # The tag is the source of truth; VERSION must agree or the .dmg
          # would be named differently from the release it ships in.
          FILE_VERSION="$(cat VERSION)"
          if [ "${VERSION}" != "${FILE_VERSION}" ]; then
            echo "::error::tag ${TAG} não bate com VERSION (${FILE_VERSION})"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build .dmg
        run: ./scripts/build-dmg.sh

      - name: Release notes
        id: notes
        run: |
          NOTES_FILE="$(mktemp)"
          ./scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "::error::CHANGELOG.md não tem a seção [${{ steps.version.outputs.version }}]"
            exit 1
          fi
          # The .dmg is signed ad hoc, so every release repeats how to get past
          # Gatekeeper — otherwise the first run looks like a broken download.
          cat >> "${NOTES_FILE}" <<'FOOTER'

          ---

          ### Instalação

          1. Baixe o `.dmg`, abra e arraste `MenuAgent.app` para `Applications`.
          2. O app é assinado ad-hoc, então o Gatekeeper bloqueia a primeira
             abertura. Libere em **Ajustes do Sistema › Privacidade e Segurança
             › Abrir Assim Mesmo**, ou rode:

             ```bash
             xattr -dr com.apple.quarantine /Applications/MenuAgent.app
             ```

          3. Instale o runtime do agente: `brew install can1357/tap/omp`
          4. Abra o painel com `Control + Option + Espaço` e grave a chave com
             `/key sk-suachave`.
          FOOTER
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG="build/MenuAgent-${{ steps.version.outputs.version }}.dmg"
          # Idempotent: a re-run of a failed job must update the existing
          # release instead of erroring out on a duplicate tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "MenuAgent ${TAG}" \
              --notes-file "${{ steps.notes.outputs.path }}"
            gh release upload "${TAG}" "${DMG}" --clobber
          else
            gh release create "${TAG}" "${DMG}" \
              --title "MenuAgent ${TAG}" \
              --notes-file "${{ steps.notes.outputs.path }}"
          fi
